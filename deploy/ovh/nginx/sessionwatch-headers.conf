# /etc/nginx/snippets/sessionwatch-headers.conf
#
# Included by every location that sets a header of its own.
#
# nginx does not merge add_header down into a location. A location carrying a
# single add_header of its own discards every add_header inherited from the
# server block, silently and with no warning at startup. Setting these once at
# server level therefore delivers them only on responses from locations that
# set nothing -- which here is none of them.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
