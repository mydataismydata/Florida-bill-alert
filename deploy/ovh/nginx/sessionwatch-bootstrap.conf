# /etc/nginx/sites-available/sessionwatch — the version used before a
# certificate exists.
#
# nginx refuses to start when ssl_certificate names a file that is not there,
# and a certificate cannot be issued until nginx answers on port 80. This file
# breaks that circle. It serves the full site, endpoints included, over plain
# HTTP, so everything can be tested before DNS moves.
#
# It is a step, not a resting place. Left installed, it serves the site
# without TLS.

server {
    listen 80;
    listen [::]:80;
    server_name kyl.sjcrlc.org sessionwatch.sjcrlc.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include snippets/sessionwatch-body.conf;
}
