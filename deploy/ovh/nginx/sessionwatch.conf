# /etc/nginx/sites-available/sessionwatch
#
# Almost all of this site is 8,000 pre-rendered HTML files. nginx reads them
# straight off disk; nothing proxies them. Six PHP endpoints handle
# subscriptions, and only those six reach the FPM container.
#
# Three companion files, all required. nginx will not start without any of them:
#   conf.d/sessionwatch-limits.conf     declares the rate limit zone
#   snippets/sessionwatch-body.conf     the site itself
#   snippets/sessionwatch-headers.conf  included by every location in the body
#
# The site lives at kyl.sjcrlc.org. sessionwatch.sjcrlc.org was its first name
# and stays up only to send readers on, so every link already emailed keeps
# working. Each name has its own certificate.

server {
    listen 80;
    listen [::]:80;
    server_name kyl.sjcrlc.org sessionwatch.sjcrlc.org;

    # Renewal happens over HTTP, so this cannot sit inside the redirect. Both
    # names renew through here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://kyl.sjcrlc.org$request_uri;
    }
}

server {
    # `http2 on;` is the 1.25.1+ spelling. This box runs nginx 1.24, where the
    # only form is a listen parameter, and the newer directive is a hard error
    # that stops nginx starting at all.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kyl.sjcrlc.org;

    ssl_certificate     /etc/letsencrypt/live/kyl.sjcrlc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kyl.sjcrlc.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/sessionwatch-body.conf;
}

# The old name. 308 rather than 301: a form posted from a page still open on
# the old name is posted again at the new one, not turned into a GET.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sessionwatch.sjcrlc.org;

    ssl_certificate     /etc/letsencrypt/live/sessionwatch.sjcrlc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sessionwatch.sjcrlc.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/sessionwatch/site;

    # Every digest already sent carries a List-Unsubscribe header naming this
    # host, and mail clients act on it with a one-click POST. RFC 8058 forbids
    # answering that POST with a redirect, and a client that gets one can drop
    # the unsubscribe without telling anyone. So it is answered here, by the
    # same handler the site uses.
    location = /unsubscribe.php {
        limit_req zone=sessionwatch_php burst=10 nodelay;

        include snippets/sessionwatch-headers.conf;
        add_header Cache-Control "no-store" always;

        include        fastcgi_params;
        fastcgi_pass   127.0.0.1:9010;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $document_root;
        fastcgi_read_timeout 30s;
    }

    location / {
        return 308 https://kyl.sjcrlc.org$request_uri;
    }
}
