# /etc/nginx/conf.d/sessionwatch-limits.conf
#
# Ubuntu's nginx.conf includes conf.d/*.conf inside the http block, which is
# the only place limit_req_zone is allowed.
#
# Two things in this file are shared with every other application on the box.
#
# Zone names are global. PAC Tracker already declares pactrack_public and
# pactrack_gate; reusing either name makes nginx refuse to start, which takes
# PAC Tracker down along with this site. The name below is prefixed to keep
# that from happening.
#
# limit_req_status is deliberately absent. It takes one value for the whole
# http block, PAC Tracker already sets it to 429, and a second declaration is
# a duplicate-directive error rather than an override. 429 is what this site
# wants anyway.

# The write endpoints: subscribe, confirm, manage, preferences, unsubscribe,
# request analysis. Each one sends a mail or writes a row. 20 a minute per
# address is far more than a person changing their settings, and far less than
# a script working through a list of addresses.
limit_req_zone $binary_remote_addr zone=sessionwatch_php:10m rate=20r/m;
