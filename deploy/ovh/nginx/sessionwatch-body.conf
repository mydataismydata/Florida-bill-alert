# /etc/nginx/snippets/sessionwatch-body.conf
#
# Everything the site does, independent of how it is reached. Both server
# blocks include this: the bootstrap one that runs before a certificate
# exists, and the TLS one that replaces it.
#
# It is one file rather than two copies because the rules below include the
# ones that keep the database password from being served as text. Two copies
# drift, and the copy that drifts is the one nobody is looking at during a
# cutover.

root /srv/sessionwatch/site;
index index.html;

# Bill pages are mostly text and compress by roughly eight to one. The search
# index is half a megabyte of JSON and compresses further than that.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml image/svg+xml;

# Not set here. nginx discards inherited add_header directives in any location
# that sets one of its own, so headers declared at this level would reach
# nothing. snippets/sessionwatch-headers.conf carries them and every location
# below includes it.

# ---- what must never be served -----------------------------------------
# config.php holds the database password and the secret that signs every
# manage and unsubscribe link. It sits in the web root because lib.php looks
# for it beside itself. nginx has no PHP handler of its own, so without this
# rule that file would be served as plain text.
#
# Declared before the FPM block on purpose: nginx takes the first matching
# regex location, so a file added to the site but not to the allowlist below
# is refused rather than leaked.
location ~ ^/(config|lib|schema|send|selftest|requests)\.(php|sql)$ {
    return 404;
}

# Digest payloads, written by the analysis box and read by send.php off disk.
# Nothing fetches them over HTTP.
location ^~ /mail/ {
    return 404;
}

# ---- the six endpoints --------------------------------------------------
location ~ ^/(subscribe|confirm|manage|preferences|unsubscribe|request-analysis)\.php$ {
    limit_req zone=sessionwatch_php burst=10 nodelay;

    include snippets/sessionwatch-headers.conf;
    # A settings page is that one reader's, and an unsubscribe confirmation is
    # a one-off. Neither should sit in a shared cache.
    add_header Cache-Control "no-store" always;

    include        fastcgi_params;
    fastcgi_pass   127.0.0.1:9010;
    # The container mounts the site at this same path, so the filename nginx
    # computes is the filename PHP opens.
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param  DOCUMENT_ROOT   $document_root;
    fastcgi_read_timeout 30s;
}

# Anything else ending in .php or .sql is not part of this site.
location ~ \.(php|sql)$ {
    return 404;
}

# ---- static -------------------------------------------------------------
# Fonts and icons are content-stable and named by hand, so they can be held
# for a year. The stylesheet changes with the design and is small, so it is
# revalidated instead.
# Cache lifetimes are written as Cache-Control and nowhere else. Pairing
# `expires` with an `add_header Cache-Control` sends the header twice, with two
# different values, and leaves which one wins up to the client.
location ~* \.(woff2|ico|png)$ {
    include snippets/sessionwatch-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location = /style.css {
    include snippets/sessionwatch-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
}

# Every build rewrites these. An hour is long enough to absorb a burst of
# readers and short enough that a correction reaches them the same day.
location / {
    include snippets/sessionwatch-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri $uri/ =404;
}
