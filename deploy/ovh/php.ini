; The endpoints render small pages and send small mails. Nothing here needs
; room to grow, and a tight limit turns a runaway into an error rather than
; into memory the other application on this box was relying on.
memory_limit = 64M
post_max_size = 256K
upload_max_filesize = 0
max_execution_time = 30

; A PHP error printed into a response would put a filesystem path, and
; sometimes a query, in front of a reader. Log it instead.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

expose_php = Off
date.timezone = UTC

; mail() calls this, and msmtp-mta puts msmtp behind it. lib.php appends
; -f<from_email>, which msmtp reads as the envelope sender.
sendmail_path = "/usr/sbin/sendmail -t -i"
