; Overrides layered on top of the image's www pool.
[www]
; The healthcheck asks FPM directly whether the pool is answering. Without
; this path there is nothing to ask, and a dead pool looks healthy.
ping.path = /ping
ping.response = pong

; A subscribe or unsubscribe is a request every few minutes at busiest. Four
; workers is generous; the ceiling matters more than the floor, because this
; box is shared and the other application wants its memory back.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Only ever executes .php, and only what nginx forwards. nginx forwards six
; named files; this is the second lock on the same door.
security.limit_extensions = .php

catch_workers_output = yes
decorate_workers_output = no
